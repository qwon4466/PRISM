[versions]
# 04 visualization-engine 과 같은 빌드 도구 (AGP 9.5.1 내장 Kotlin, Kotlin 2.2.10, Compose BOM 2026.02.01)
kotlin = "2.2.10"
agp = "9.5.1"
coroutines = "1.9.0"
serialization = "1.9.0"
compose-bom = "2026.02.01"
activity-compose = "1.9.3"
lifecycle = "2.8.7"
junit4 = "4.13.2"
androidx-test-junit = "1.2.1"
androidx-test-runner = "1.6.2"
# Pleos SDK — nexus-playground.pleos.ai 에서 2026-11-10 확인한 최신 릴리스
pleos-vehicle = "2.3.2"
pleos-fused-location = "1.1.3"
pleos-navi-helper = "3.0.5"
pleos-tts = "3.3.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

pleos-vehicle = { module = "ai.pleos.playground:Vehicle", version.ref = "pleos-vehicle" }
pleos-fused-location = { module = "ai.pleos.playground:FusedLocation", version.ref = "pleos-fused-location" }
pleos-navi-helper = { module = "ai.pleos.playground:NaviHelper", version.ref = "pleos-navi-helper" }
pleos-tts = { module = "ai.pleos.playground:TextToSpeech", version.ref = "pleos-tts" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
